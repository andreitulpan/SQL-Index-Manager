<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a password - SQL Index Manager</title>
<link rel="stylesheet" href="/theme.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(900px 600px at 10% -10%, rgba(var(--steel-light-rgb), .85), transparent 60%),
      radial-gradient(700px 500px at 95% 15%, rgba(var(--glow-rgb), .13), transparent 60%),
      radial-gradient(800px 600px at 60% 110%, rgba(var(--steel-rgb), .9), transparent 60%),
      var(--navy-deep);
    background-attachment: fixed;
  }
  form {
    width: 100%; max-width: 360px; padding: 32px; border-radius: 20px;
    background: rgba(var(--steel-rgb), .38); border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .10);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    form { background: rgba(var(--navy-rgb), .85); }
  }
  h1 { margin: 0 0 4px; font-size: 20px; color: var(--accent); letter-spacing: .3px; }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  input {
    width: 100%; margin-bottom: 16px; background: rgba(var(--deep-rgb), .45); color: var(--text);
    border: 1px solid rgba(255, 255, 255, .14); border-radius: 10px; padding: 10px 12px; font: inherit;
  }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; background: var(--accent); color: var(--navy); border: 0; border-radius: 10px;
    padding: 11px 16px; font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(var(--accent-rgb), .22), inset 0 1px 0 rgba(255, 255, 255, .45);
  }
  button:disabled { opacity: .5; cursor: default; }
  .linkbtn { margin-top: 12px; background: none; box-shadow: none; color: var(--muted); font-weight: 400; padding: 6px; }
  .linkbtn:hover { color: var(--text); }
  #error { display: none; margin-bottom: 16px; padding: 9px 12px; border-radius: 10px; background: rgba(217, 83, 79, .18); border: 1px solid rgba(217, 83, 79, .6); }
  #error.visible { display: block; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; }
  footer b { font-weight: 600; color: var(--text); }
</style>
</head>
<body>
<form id="form" novalidate>
  <h1>Choose your password</h1>
  <p>The password you were given is only for the first sign-in. Choose one of your own to continue.</p>
  <div id="error" role="alert"></div>
  <label for="current">Password you were given</label>
  <input id="current" type="password" autocomplete="current-password" required autofocus>
  <label for="next">New password (at least 8 characters)</label>
  <input id="next" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
  <label for="again">New password again</label>
  <input id="again" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
  <button id="submit" type="submit">Change password</button>
  <button id="logout" class="linkbtn" type="button">Sign out</button>
</form>
<footer>SQL Index Manager <b id="appVersion"></b></footer>
<script>
fetch("/api/version").then(r => r.json()).then(v => {
  document.getElementById("appVersion").textContent = "v" + v.version + (v.commit ? " (" + v.commit + ")" : "");
}).catch(() => {});
</script>
<script>
"use strict";
const $ = id => document.getElementById(id);

function fail(message) {
  $("error").textContent = message;
  $("error").className = "visible";
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("error").className = "";
  if (!$("current").value) { fail("Enter the password you were given."); return; }
  if ($("next").value.length < 8) { fail("The new password needs at least 8 characters."); return; }
  if ($("next").value !== $("again").value) { fail("The two new passwords are different."); return; }
  $("submit").disabled = true;
  try {
    const res = await fetch("/api/me/password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current_password: $("current").value, new_password: $("next").value }),
    });
    if (res.ok) { location.href = "/"; return; }
    if (res.status === 401) { location.href = "/login"; return; }
    const body = await res.json().catch(() => ({}));
    fail(typeof body.detail === "string" ? body.detail : "The password could not be changed.");
  } catch (err) {
    fail("Could not reach the server.");
  } finally {
    $("submit").disabled = false;
  }
});

$("logout").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" }).catch(() => {});
  location.href = "/login";
});
</script>
</body>
</html>
